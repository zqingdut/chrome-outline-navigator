<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Outline Navigator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="popup-header">
      <div class="popup-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h16M4 12h10M4 18h14"/>
        </svg>
        <span>页面大纲</span>
      </div>
      <div class="popup-version">v1.0</div>
    </div>

    <div class="popup-stats" id="stats">
      <div class="stat-item">
        <span class="stat-value" id="headingCount">—</span>
        <span class="stat-label">检测到标题</span>
      </div>
      <div class="stat-item">
        <span class="stat-value" id="maxDepth">—</span>
        <span class="stat-label">最大层级</span>
      </div>
    </div>

    <div class="popup-controls">
      <button class="btn" id="toggleSidebar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M15 3v18"/>
        </svg>
        <span id="toggleText">显示/隐藏侧边栏</span>
      </button>
      <button class="btn" id="refreshOutline">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
        <span>刷新大纲</span>
      </button>
    </div>

    <div class="popup-shortcut">
      <kbd>Alt</kbd> + <kbd>O</kbd> 切换侧边栏
    </div>

    <div class="popup-footer">
      <span>Page Outline Navigator</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
